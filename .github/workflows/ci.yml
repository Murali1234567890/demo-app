name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/murali1234567890/demo-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Run application container
        run: docker run -d --name demo-app-test -p 8080:80 $IMAGE_NAME:${{ github.sha }}

      - name: Wait for application
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:8080; then
              exit 0
            fi
            echo "Application not ready, waiting..."
            sleep 2
          done
          echo "Application failed to become ready"
          exit 1

      - name: Test application response
        run: |
          curl --fail http://localhost:8080 | grep "Hello from CI/CD"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push $IMAGE_NAME:${{ github.sha }}

      - name: Stop test container
        if: always()
        run: docker rm -f demo-app-test
