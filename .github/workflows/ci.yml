name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t demo-app:${{ github.sha }} .

      - name: Run application container
        run: docker run -d --name demo-app-test -p 8080:80 demo-app:${{ github.sha }}

      - name: Wait for application
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:8080; then
              exit 0
            fi
            echo "Application not ready, waiting..."
            sleep 2
          done
          echo "Application failed to become ready"
          exit 1

      - name: Test application response
        run: |
          curl --fail http://localhost:8080 | grep "Hello from CI/CD"

      - name: Stop test container
        if: always()
        run: docker rm -f demo-app-test
