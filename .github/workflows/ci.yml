name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t demo-app:${{ github.sha }} .

      - name: Run application container
        run: docker run -d --name demo-app-test -p 8080:80 demo-app:${{ github.sha }}

      - name: Test application
        run: curl --fail http://localhost:8080

      - name: Stop test container
        if: always()
        run: docker rm -f demo-app-test
